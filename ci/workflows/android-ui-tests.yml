name: Full Android Emulator UI Test Suite

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [created, prereleased]

concurrency:
  group: android-full-ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # УРОВЕНЬ 3: Полный расширенный набор UI-тестов (по расписанию, вручную или перед релизом)
  connected-ui-tests:
    name: Full Instrumented UI Tests (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare empty .env file
        run: touch .env

      - name: Run Full Instrumented UI Test Suite on Android Emulator
        run: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload AndroidTest XML & HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-full-ui-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            build/test-artifacts/reports/**
          if-no-files-found: warn

      - name: Upload Emulator Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-full-ui-test-logcat
          path: build/test-artifacts/logcat.txt
          if-no-files-found: warn

      - name: Upload UI State Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-full-ui-test-screenshots
          path: build/test-artifacts/screenshots/**
          if-no-files-found: warn
