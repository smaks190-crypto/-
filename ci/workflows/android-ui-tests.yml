name: Android Emulator UI Tests

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - "feat/refactor-all-transactions-and-auto-group"
  workflow_dispatch:

concurrency:
  group: android-ui-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connected-ui-tests:
    name: Instrumented UI Tests (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env file
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=dummy_ci_key" > .env
          fi

      - name: Assemble Debug APK and AndroidTest APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Run Instrumented UI Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p build/test-artifacts/screenshots
            mkdir -p build/test-artifacts/reports
            adb wait-for-device
            adb shell input keyevent 82 || true
            adb logcat -c || true

            set +e
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            TEST_EXIT_CODE=$?
            set -e

            echo "Collecting Logcat..."
            adb logcat -d > build/test-artifacts/logcat.txt || true

            echo "Collecting UI Screenshots from Emulator..."
            adb pull /sdcard/Download/ui_screenshots/. build/test-artifacts/screenshots/ || true
            adb pull /sdcard/Android/data/ru.personalbudget.app.aadece/files/ui_screenshots/. build/test-artifacts/screenshots/ || true
            adb exec-out screencap -p > build/test-artifacts/screenshots/99_emulator_final_screen.png || true

            cp -r app/build/outputs/androidTest-results/connected/* build/test-artifacts/reports/ 2>/dev/null || true
            cp -r app/build/reports/androidTests/connected/* build/test-artifacts/reports/ 2>/dev/null || true

            ls -la build/test-artifacts/screenshots/ || true
            exit $TEST_EXIT_CODE

      - name: Upload AndroidTest XML & HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            build/test-artifacts/reports/**
          if-no-files-found: warn

      - name: Upload Emulator Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-logcat
          path: build/test-artifacts/logcat.txt
          if-no-files-found: warn

      - name: Upload UI State Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-screenshots
          path: build/test-artifacts/screenshots/**
          if-no-files-found: warn
