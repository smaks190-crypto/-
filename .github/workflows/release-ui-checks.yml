name: Release UI checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_EXTERNAL_EMULATOR: 'true'
      CI_STAGED_PIPELINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check import lifecycle and voice presentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.ui.components.BudgetDocumentImportUiTest,com.example.davidapp.live.DavidLivePresentationUiTest
      - name: Collect screenshots
        if: always()
        run: adb pull /sdcard/Android/data/ru.personalbudget.app.aadece/files/release-screenshots screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ui-results
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            screenshots
            build/test-artifacts
