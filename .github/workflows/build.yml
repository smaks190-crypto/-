# Инструкция по настройке секретов в GitHub Репозитории (Settings -> Secrets and variables -> Actions):
# 1. RELEASE_KEYSTORE_BASE64 - Строка base64, содержащая файл подписи jks (cat my-upload-key.jks | base64 -w 0)
# 2. STORE_PASSWORD - Пароль от хранилища ключей (keystore password)
# 3. KEY_PASSWORD - Пароль от ключа (key password, если отличается от STORE_PASSWORD)
# 4. KEY_ALIAS - Алиас ключа (по умолчанию "upload")
# 5. ENV_FILE - Содержимое файла .env (включая GEMINI_API_KEY)

name: Build Android APK & AAB

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          # PRs remain read-only; trusted manual feature builds may seed their branch cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # DEBUG ТОЛЬКО ДЛЯ PR И РУЧНОГО ЗАПУСКА НЕ ИЗ MAIN
      - name: Generate debug keystore
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # ВОССТАНАВЛИВАЕМ ФАЙЛ .ENV (С КЛЮЧОМ ИИ)
      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # СОБИРАЕМ APK С ПОМОЩЬЮ СИСТЕМНОГО GRADLE (ОТЛАДКА)
      - name: Build Debug APK
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        run: gradle assembleDebug

      # СОХРАНЯЕМ ГОТОВЫЙ ФАЙЛ ОТЛАДКИ
      - name: Upload APK artifact
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ПРОВЕРЯЕМ НАЛИЧИЕ РЕЛИЗНОГО КЛЮЧА
      - name: Check Release Keystore Secret
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing! Failing build to prevent silent debug-signed release."
            exit 1
          fi

      # ДЕКОДИРУЕМ РЕЛИЗНЫЙ КЛЮЧ ИЗ СЕКРЕТОВ (ЕСЛИ ЗАДАНО В GITHUB SECRETS)
      - name: Decode Release Keystore
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      # ЕДИНЫЙ НОМЕР ВЕРСИИ ДЛЯ APK И AAB
      - name: Set release version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/^VERSION_CODE=//p' version.properties)
          [[ "$base" =~ ^[0-9]+$ ]] && (( base > 0 )) || { echo "Invalid VERSION_CODE"; exit 1; }
          # Only published releases advance the public version; debug run numbers do not.
          latest_tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          previous=$base
          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]{2})-build\.[0-9]+$ ]]; then
            published=$(( (10#${BASH_REMATCH[1]} - 1) * 100 + 10#${BASH_REMATCH[2]} ))
            if (( published > previous )); then previous=$published; fi
          elif [[ -n "$latest_tag" ]]; then
            echo "Unrecognized latest release tag: $latest_tag"; exit 1
          fi
          echo "CI_VERSION_CODE=$((previous + 1))" >> "$GITHUB_ENV"

      # СНАЧАЛА APK, ЗАТЕМ AAB В ОДНОМ GRADLE ЗАПУСКЕ
      - name: Build Release APK then AAB
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease bundleRelease --no-configuration-cache

      # СОХРАНЯЕМ ГОТОВЫЕ РЕЛИЗНЫЕ ФАЙЛЫ
      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk

      # ПУБЛИКУЕМ ПОДПИСАННЫЕ APK И AAB С АВТОМАТИЧЕСКОЙ ИСТОРИЕЙ PR
      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          version=$(printf '%d.%02d' "$((1 + CI_VERSION_CODE / 100))" "$((CI_VERSION_CODE % 100))")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          gh release create "v${version}-build.${GITHUB_RUN_NUMBER}" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --title "David Finance AI v${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --latest

      # ПРЕОБРАЗУЕМ СТАНДАРТНЫЕ ЗАМЕТКИ GITHUB В РУССКОЯЗЫЧНЫЙ ФОРМАТ
      - name: Localize release notes to Russian
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release view "$tag" --json body --jq .body > /tmp/release-notes-original.md
          python3 .github/scripts/localize_release_notes.py /tmp/release-notes-original.md /tmp/release-notes-ru.md
          gh release edit "$tag" --notes-file /tmp/release-notes-ru.md

      # ОБНОВЛЯЕМ БЛОК README ПОСЛЕ УСПЕШНОЙ ПУБЛИКАЦИИ
      - name: Update README with latest version and changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${RELEASE_VERSION}-build.${GITHUB_RUN_NUMBER}" --json body --jq .body > /tmp/release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          import os
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          start = "<!-- LATEST_RELEASE_START -->"
          end = "<!-- LATEST_RELEASE_END -->"
          assert content.count(start) == 1 and content.count(end) == 1
          notes = Path("/tmp/release-notes.md").read_text(encoding="utf-8").strip()
          if not notes:
              notes = "В этом выпуске нет автоматически описанных изменений."
          block = (f"{start}\n### Версия v{os.environ['RELEASE_VERSION']} (сборка {os.environ['GITHUB_RUN_NUMBER']})\n\n"
                   "[📥 Скачать последнюю версию APK](https://github.com/smaks190-crypto/-/releases/latest/download/app-release.apk)\n\n"
                   f"**Что изменилось:**\n\n{notes}\n{end}")
          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)
          readme.write_text(before + block + after, encoding="utf-8")
          PY
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest release information [skip ci]"
          git push origin HEAD:main
