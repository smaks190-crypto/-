# Инструкция по настройке секретов в GitHub Репозитории (Settings -> Secrets and variables -> Actions):
# 1. RELEASE_KEYSTORE_BASE64 - Строка base64, содержащая файл подписи jks (cat my-upload-key.jks | base64 -w 0)
# 2. STORE_PASSWORD - Пароль от хранилища ключей (keystore password)
# 3. KEY_PASSWORD - Пароль от ключа (key password, если отличается от STORE_PASSWORD)
# 4. KEY_ALIAS - Алиас ключа (по умолчанию "upload")
# 5. ENV_FILE - Содержимое файла .env (включая GEMINI_API_KEY)

name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # СОЗДАЕМ ТЕСТОВЫЙ КЛЮЧ ПОДПИСИ
      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # ВОССТАНАВЛИВАЕМ ФАЙЛ .ENV (С КЛЮЧОМ ИИ)
      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # СОБИРАЕМ APK С ПОМОЩЬЮ СИСТЕМНОГО GRADLE (ОТЛАДКА)
      - name: Build Debug APK
        run: gradle assembleDebug

      # СОХРАНЯЕМ ГОТОВЫЙ ФАЙЛ ОТЛАДКИ
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ПРОВЕРЯЕМ НАЛИЧИЕ РЕЛИЗНОГО КЛЮЧА
      - name: Check Release Keystore Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing! Failing build to prevent silent debug-signed release."
            exit 1
          fi

      # ДЕКОДИРУЕМ РЕЛИЗНЫЙ КЛЮЧ ИЗ СЕКРЕТОВ (ЕСЛИ ЗАДАНО В GITHUB SECRETS)
      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      # СОБИРАЕМ РЕЛИЗНЫЙ BUNDLE (.AAB)
      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle bundleRelease --no-configuration-cache

      # СОБИРАЕМ РЕЛИЗНЫЙ APK (.APK)
      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-configuration-cache

      # СОХРАНЯЕМ ГОТОВЫЕ РЕЛИЗНЫЕ ФАЙЛЫ
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
